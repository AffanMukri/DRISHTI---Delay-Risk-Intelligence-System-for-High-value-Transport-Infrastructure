[project]
name = "drishti-api"
version = "0.1.0"
description = "DRISHTI FastAPI runtime for Vercel"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.116,<1.0",
  "pydantic>=2.11,<3.0",
  "pydantic-settings>=2.10,<3.0",
  "email-validator>=2.2,<3.0",
  "sqlalchemy[asyncio]>=2.0.41,<3.0",
  "psycopg[binary,pool]>=3.2.9,<4.0",
  "httpx>=0.28,<1.0",
  "python-multipart>=0.0.20,<1.0",
  "openpyxl>=3.1.5,<4.0",
  "numpy>=2.2,<3.0",
  "scikit-learn>=1.7,<2.0",
  "scipy>=1.15,<2.0",
  "joblib>=1.4,<2.0",
  "shap==0.51.0",
  "numba==0.63.1",
  "llvmlite==0.46.0",
  "pymupdf>=1.26,<2.0",
  "reportlab>=4.2,<5.0",
]

[tool.uv]
package = false
environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
required-environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
